services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHON_EVAL_URL=http://eval_service:8002
    depends_on:
      - agent_service
      - eval_service

  agent_service:
    build:
      context: ./python-services/agent_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXTJS_INTERNAL_URL=http://nextjs:3000
      - SIMULATE_ROADBLOCKS=${SIMULATE_ROADBLOCKS}

  eval_service:
    build:
      context: ./python-services/eval_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXTJS_INTERNAL_URL=http://nextjs:3000
